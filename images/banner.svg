<svg viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: "Cascadia Code", "SF Mono", Consolas, "Courier New", monospace; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGradient)"/>
  
  <!-- Subtle Grid Background -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="120" y1="0" x2="120" y2="420"/>
    <line x1="240" y1="0" x2="240" y2="420"/>
    <line x1="360" y1="0" x2="360" y2="420"/>
    <line x1="480" y1="0" x2="480" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="720" y1="0" x2="720" y2="420"/>
    <line x1="840" y1="0" x2="840" y2="420"/>
    <line x1="960" y1="0" x2="960" y2="420"/>
    <line x1="1080" y1="0" x2="1080" y2="420"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="120" r="140" fill="#0284c7" opacity="0.12" filter="url(#glowCyan)"/>
  <circle cx="1080" cy="280" r="160" fill="#7e22ce" opacity="0.14" filter="url(#glowPurple)"/>
  <circle cx="720" cy="60" r="100" fill="#38bdf8" opacity="0.08" filter="url(#glowCyan)"/>

  <!-- Border Outline -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6"/>

  <!-- LEFT COLUMN: BRANDING & TITLE -->
  <g transform="translate(60, 50)">
    <!-- Badge -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="14" cy="14" r="4" fill="#38bdf8"/>
    <text x="26" y="18.5" class="font-sans" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="0.5">WINDOWS 11 FLUENT DESIGN</text>

    <!-- Main Title -->
    <g transform="translate(0, 72)">
      <!-- Lightning Icon -->
      <path d="M14 0 L0 26 L12 26 L8 44 L28 16 L16 16 Z" fill="url(#accentCyan)" filter="url(#subtleGlow)" transform="translate(0, -6) scale(1.1)"/>
      <text x="42" y="32" class="font-sans" font-size="44" font-weight="900" fill="url(#logoGrad)" letter-spacing="-0.5">OptiWin <tspan fill="#38bdf8">PRO</tspan></text>
      <text x="325" y="14" class="font-sans" font-size="12" font-weight="800" fill="#f59e0b" letter-spacing="1">v2.0</text>
    </g>

    <!-- Subtitle / Tagline -->
    <text x="0" y="132" class="font-sans" font-size="17" font-weight="500" fill="#cbd5e1" letter-spacing="-0.2">
      Hardware Dashboard • 1-Click Tuning Profiles • Privacy &amp; Gaming Engine
    </text>

    <!-- Description -->
    <text x="0" y="160" class="font-sans" font-size="13.5" font-weight="400" fill="#94a3b8">
      Optimizador nativo de alto rendimiento en C# (.NET 8) y WPF-UI (Mica Dark).
    </text>
    <text x="0" y="180" class="font-sans" font-size="13.5" font-weight="400" fill="#94a3b8">
      Inspirado en recetas de optimizerNXT con transparencia absoluta de Registro y Servicios.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 215)">
      <!-- Pill 1: Latencia 0 -->
      <rect x="0" y="0" width="138" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="20.5" class="font-sans" font-size="12" font-weight="600" fill="#f8fafc">⚡ Cero Latencia</text>

      <!-- Pill 2: Hardware en Vivo -->
      <rect x="148" y="0" width="168" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="162" y="20.5" class="font-sans" font-size="12" font-weight="600" fill="#f8fafc">📊 Hardware en Vivo</text>

      <!-- Pill 3: 1-Clic Perfiles -->
      <rect x="326" y="0" width="145" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="340" y="20.5" class="font-sans" font-size="12" font-weight="600" fill="#f8fafc">🎮 1-Clic Perfiles</text>

      <!-- Pill 4: Sin Telemetría -->
      <rect x="481" y="0" width="158" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="495" y="20.5" class="font-sans" font-size="12" font-weight="600" fill="#f8fafc">🛡️ Privacidad Total</text>
    </g>

    <!-- Author & Framework info -->
    <g transform="translate(0, 285)">
      <text x="0" y="16" class="font-mono" font-size="12" fill="#64748b">Desarrollado por Fabricio Riguetto • 100% C# .NET 8 • WPF-UI</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: UI MOCKUP / HARDWARE DASHBOARD CARDS -->
  <g transform="translate(730, 42)">
    <!-- Container Card (Mica Glass Effect) -->
    <rect x="0" y="0" width="410" height="336" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" stroke-opacity="0.8"/>

    <!-- Window Titlebar Mockup -->
    <rect x="0" y="0" width="410" height="38" rx="16" fill="#0f172a" fill-opacity="0.9"/>
    <rect x="0" y="26" width="410" height="12" fill="#0f172a" fill-opacity="0.9"/>
    <line x1="0" y1="38" x2="410" y2="38" stroke="#1e293b" stroke-width="1"/>

    <!-- Traffic Lights -->
    <circle cx="20" cy="19" r="5" fill="#ef4444"/>
    <circle cx="36" cy="19" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="19" r="5" fill="#10b981"/>
    <text x="72" y="23" class="font-mono" font-size="11.5" font-weight="600" fill="#94a3b8">OptiWin Dashboard v2.0</text>

    <!-- Live Metric Card: CPU -->
    <g transform="translate(18, 52)">
      <rect x="0" y="0" width="116" height="74" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="22" class="font-sans" font-size="11" font-weight="600" fill="#94a3b8">🖥️ CPU</text>
      <text x="12" y="48" class="font-sans" font-size="20" font-weight="800" fill="#38bdf8">14%</text>
      <rect x="12" y="58" width="92" height="4" rx="2" fill="#1e293b"/>
      <rect x="12" y="58" width="16" height="4" rx="2" fill="#38bdf8"/>
    </g>

    <!-- Live Metric Card: GPU -->
    <g transform="translate(146, 52)">
      <rect x="0" y="0" width="116" height="74" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="22" class="font-sans" font-size="11" font-weight="600" fill="#94a3b8">🎮 GPU 3D</text>
      <text x="12" y="48" class="font-sans" font-size="20" font-weight="800" fill="#c084fc">38%</text>
      <rect x="12" y="58" width="92" height="4" rx="2" fill="#1e293b"/>
      <rect x="12" y="58" width="36" height="4" rx="2" fill="#c084fc"/>
    </g>

    <!-- Live Metric Card: RAM -->
    <g transform="translate(274, 52)">
      <rect x="0" y="0" width="116" height="74" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="22" class="font-sans" font-size="11" font-weight="600" fill="#94a3b8">🧠 RAM</text>
      <text x="12" y="48" class="font-sans" font-size="20" font-weight="800" fill="#34d399">26%</text>
      <rect x="12" y="58" width="92" height="4" rx="2" fill="#1e293b"/>
      <rect x="12" y="58" width="24" height="4" rx="2" fill="#34d399"/>
    </g>

    <!-- 1-Click Profile Action Bar -->
    <g transform="translate(18, 140)">
      <rect x="0" y="0" width="372" height="42" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
      <!-- Gaming button -->
      <rect x="6" y="6" width="86" height="30" rx="6" fill="#dc2626" fill-opacity="0.85"/>
      <text x="18" y="25" class="font-sans" font-size="10.5" font-weight="700" fill="#ffffff">⚡ Gaming</text>
      
      <!-- Work button -->
      <rect x="98" y="6" width="86" height="30" rx="6" fill="#0284c7" fill-opacity="0.85"/>
      <text x="110" y="25" class="font-sans" font-size="10.5" font-weight="700" fill="#ffffff">💼 Trabajo</text>

      <!-- Creator button -->
      <rect x="190" y="6" width="86" height="30" rx="6" fill="#475569" fill-opacity="0.85"/>
      <text x="198" y="25" class="font-sans" font-size="10.5" font-weight="700" fill="#ffffff">🎬 Creación</text>

      <!-- Restore button -->
      <rect x="282" y="6" width="84" height="30" rx="6" fill="#1e293b"/>
      <text x="296" y="25" class="font-sans" font-size="10.5" font-weight="600" fill="#94a3b8">🔄 Reset</text>
    </g>

    <!-- Disks & Tweaks Section Mockup -->
    <g transform="translate(18, 196)">
      <rect x="0" y="0" width="372" height="66" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="24" class="font-sans" font-size="11" font-weight="700" fill="#cbd5e1">💾 C: NVMe SSD (Windows)</text>
      <text x="315" y="24" class="font-sans" font-size="12" font-weight="800" fill="#38bdf8">31%</text>
      <rect x="14" y="34" width="344" height="6" rx="3" fill="#1e293b"/>
      <rect x="14" y="34" width="112" height="6" rx="3" fill="#38bdf8"/>
      <text x="14" y="54" class="font-mono" font-size="10.5" fill="#64748b">Libre: 642 GB / 931 GB</text>
    </g>

    <!-- Terminal Activity Line Mockup -->
    <g transform="translate(18, 276)">
      <rect x="0" y="0" width="372" height="44" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1"/>
      <circle cx="14" cy="22" r="3.5" fill="#10b981"/>
      <text x="26" y="26" class="font-mono" font-size="10.5" fill="#a5b4fc">
        [ÉXITO] Ultimate Performance + GPU Priority 8
      </text>
    </g>
  </g>
</svg>
